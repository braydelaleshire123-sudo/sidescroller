<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DINO RUN 8-BIT</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#fff;color:#000;font-family:"Courier New",monospace;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #game{position:relative;width:min(100vw,1100px);height:min(100vh,600px);border:6px solid #000;background:#fff;overflow:hidden;image-rendering:pixelated}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  #hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;text-align:center;pointer-events:none}
  #touch{position:absolute;right:18px;bottom:18px;width:88px;height:52px;border:4px solid #000;background:#fff;font:bold 16px "Courier New";display:none}
  @media (pointer:coarse){#touch{display:block}}
</style>
</head>
<body>
<div id="game">
<canvas id="c" width="1100" height="600"></canvas>
<div id="hint">SPACE / ↑ / CLICK = JUMP</div>
<button id="touch">JUMP</button>
</div>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),W=1100,H=600;
ctx.imageSmoothingEnabled=false;
let state="title",distance=0,score=0,speed=7,high=Number(localStorage.dinoHigh||0);
let last=0,spawn=0,groundY=475,obstacles=[],clouds=[];
let dino={x:145,y:0,w:62,h:58,vy:0,onGround:true,frame:0};
function rect(x,y,w,h,fill="#000"){ctx.fillStyle=fill;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(t,x,y,size=22,align="left"){ctx.fillStyle="#000";ctx.font=`bold ${size}px "Courier New"`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function reset(){
 distance=0;score=0;speed=7;spawn=0;obstacles=[];clouds=[];
 dino.y=groundY-dino.h;dino.vy=0;dino.onGround=true;dino.frame=0;
 for(let i=0;i<5;i++) clouds.push({x:180+i*230+Math.random()*100,y:80+Math.random()*100,w:45+Math.random()*50});
 state="play";
}
function jump(){
 if(state==="title"||state==="gameover"){reset();return}
 if(dino.onGround){dino.vy=-16;dino.onGround=false}
}
function makeObstacle(){
 const r=Math.random();
 if(r<.7){
   const h=35+Math.random()*38,w=22+Math.random()*18;
   obstacles.push({x:W+20,y:groundY-h,w,h,type:"cactus"});
 }else{
   obstacles.push({x:W+20,y:groundY-28,w:48,h:28,type:"rock"});
 }
}
function collide(a,b){return a.x+10<b.x+b.w-5&&a.x+a.w-10>b.x+5&&a.y+8<b.y+b.h&&a.y+a.h-5>b.y}
function drawDino(){
 const x=dino.x,y=dino.y;
 // chunky 8-bit dinosaur silhouette
 rect(x+8,y+12,34,38);rect(x+28,y+3,27,25);rect(x+48,y+10,13,13);
 rect(x+18,y+47,9,11);rect(x+39,y+47,9,11);
 rect(x+3,y+23,16,9);rect(x+27,y+29,10,7);
 rect(x+44,y+8,5,5,"#fff");
 // tail
 rect(x-8,y+27,14,8);rect(x-15,y+33,10,6);
 // running animation
 if(!dino.onGround||Math.floor(dino.frame/6)%2===0){rect(x+18,y+55,9,3);rect(x+39,y+55,3,7)}
 else{rect(x+18,y+55,3,7);rect(x+39,y+55,9,3)}
}
function drawCactus(o){
 if(o.type==="rock"){rect(o.x,o.y+10,o.w,o.h-10);rect(o.x+7,o.y,o.w-14,12);return}
 rect(o.x+8,o.y,o.w-12,o.h);
 rect(o.x,o.y+18,11,9);rect(o.x-2,o.y+10,10,10);
 rect(o.x+o.w-3,o.y+29,10,9);rect(o.x+o.w-3,o.y+20,7,12);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // subtle 8-bit sky
 for(const c of clouds){rect(c.x,c.y,c.w,5);rect(c.x+10,c.y-5,c.w-20,5)}
 text("DINO RUN",30,48,24);
 text("DIST "+String(Math.floor(distance)).padStart(5,"0"),W-30,48,20,"right");
 text("HI "+String(high).padStart(5,"0"),W-30,74,16,"right");
 // ground
 rect(0,groundY,W,5);
 for(let x=-(distance*2%80);x<W;x+=80) rect(x,groundY+13,48,3);
 drawDino();
 for(const o of obstacles)drawCactus(o);
 if(state==="title"){
   rect(0,0,W,H,"rgba(255,255,255,.92)");
   text("DINO RUN",W/2,205,58,"center");
   text("8-BIT / BLACK & WHITE",W/2,245,22,"center");
   text("PRESS SPACE OR CLICK TO START",W/2,315,24,"center");
   text("JUMP OVER CACTI. GO FARTHER. GET FASTER.",W/2,355,16,"center");
 }
 if(state==="gameover"){
   rect(0,0,W,H,"rgba(255,255,255,.9)");
   text("GAME OVER",W/2,225,54,"center");
   text("DISTANCE: "+Math.floor(distance),W/2,270,22,"center");
   text("PRESS SPACE / CLICK TO RUN AGAIN",W/2,325,20,"center");
 }
}
function loop(t){
 const dt=Math.min((t-last)/16.67,2);last=t;
 if(state==="play"){
   distance+=speed*.018*dt;
   score=Math.floor(distance);
   speed=7+Math.min(13,distance/180);
   dino.vy+=.85*dt;dino.y+=dino.vy*dt;
   if(dino.y>=groundY-dino.h){dino.y=groundY-dino.h;dino.vy=0;dino.onGround=true}
   dino.frame+=dt*speed;
   spawn-=dt;
   if(spawn<=0){makeObstacle();spawn=Math.max(32,78-speed*2)+Math.random()*42}
   for(const o of obstacles)o.x-=speed*dt;
   obstacles=obstacles.filter(o=>o.x+o.w>-30);
   for(const o of obstacles)if(collide(dino,o)){state="gameover";high=Math.max(high,score);localStorage.dinoHigh=high}
   for(const c of clouds){c.x-=speed*.12*dt;if(c.x+c.w<0)c.x=W+Math.random()*180}
 }
 draw();requestAnimationFrame(loop);
}
addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}});
canvas.addEventListener("pointerdown",jump);
document.getElementById("touch").addEventListener("pointerdown",e=>{e.stopPropagation();jump()});
requestAnimationFrame(loop);
</script>
</body>
</html>
