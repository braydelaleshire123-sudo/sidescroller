<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DINO RUN 16-BIT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:#000;font-family:"Courier New",monospace;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
 #game{position:relative;width:min(100vw,1100px);height:min(100vh,600px);border:6px solid #000;background:#fff;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;text-align:center;pointer-events:none}#zflash{position:absolute;left:50%;top:90px;transform:translateX(-50%);font:bold 24px "Courier New";pointer-events:none}
#music{position:absolute;left:18px;bottom:18px;height:44px;padding:0 14px;border:4px solid #000;background:#fff;color:#000;font:bold 14px "Courier New";z-index:5}#touch,#super{position:absolute;right:18px;bottom:18px;height:54px;border:4px solid #000;background:#fff;color:#000;font:bold 16px "Courier New";display:none}#touch{width:92px}#super{right:120px;width:150px}
#super{display:block}@media(pointer:coarse){#touch,#super{display:block}}
</style>
</head>
<body>
<div id="game">
<canvas id="c" width="1100" height="600"></canvas>
<div id="hint">SPACE / ↑ / CLICK = JUMP • Z = SUPER JUMP! • X = 3X • C = 10X • V = TUNG TUNG TUNG SAHUR • N = NUKE • B = COLOR</div><div id="zflash"></div>
<button id="music">MUSIC: ON</button><button id="touch">JUMP</button><button id="super">Z SUPER JUMP</button>
</div>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),W=1100,H=600;
ctx.imageSmoothingEnabled=false;
let state="title",distance=0,score=0,speed=7,high=Number(localStorage.dinoHigh||0);
let last=0,spawn=0,groundY=475,obstacles=[],clouds=[];
let turboMode=0,turboTime=0,lastSuperJump=0,nukeFlash=0,nukePower=0,nukeTimer=0,audioCtx=null,musicOn=true,musicTimer=null,brainrot=null,colorMode=false;
const dino={x:145,y:0,w:82,h:72,vy:0,onGround:true,frame:0};
function rect(x,y,w,h,fill="#000"){ctx.fillStyle=fill;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(t,x,y,size=22,align="left"){ctx.fillStyle="#000";ctx.font=`bold ${size}px "Courier New"`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function startMusic(){
 if(!musicOn)return;
 try{
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  if(musicTimer)return;
  const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
  let i=0;
  musicTimer=setInterval(()=>{
   if(!musicOn||!audioCtx)return;
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="square";o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(0.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.18);
   o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.2);
  },220);
 }catch(e){}
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
function reset(){
 distance=0;score=0;speed=7;spawn=0;obstacles=[];clouds=[];turboMode=0;turboTime=0;nukePower=0;nukeTimer=0;
 dino.x=145;dino.y=groundY-dino.h;dino.vy=0;dino.onGround=true;dino.frame=0;brainrot=null;
 for(let i=0;i<6;i++)clouds.push({x:80+i*210+Math.random()*120,y:65+Math.random()*110,w:55+Math.random()*65});
 state="play";startMusic();
}
function jump(){if(state==="title"||state==="gameover"){reset();return}if(dino.onGround){dino.vy=-16.8;dino.onGround=false}}
function superJump(){
 const now=performance.now();if(now-lastSuperJump<250)return;lastSuperJump=now;
 document.getElementById("zflash").textContent="Z SUPER JUMP!";setTimeout(()=>document.getElementById("zflash").textContent="",500);
 if(state==="title"||state==="gameover")reset();if(state!=="play")return;
 dino.y=groundY-dino.h-1;dino.vy=-45;dino.onGround=false;
}
function nuke(){
 if(state==="title"||state==="gameover")reset();if(state!=="play")return;
 nukeFlash=1;nukePower=1;nukeTimer=2.6;obstacles=[];brainrot=null;
 dino.x=145;dino.vy=-32;dino.y=groundY-dino.h-1;dino.onGround=false;turboMode=0;turboTime=0;
}
function spawnBrainrot(){
 if(state==="title"||state==="gameover")reset();if(state!=="play")return;
 brainrot={x:W+80,y:groundY-76,w:62,h:76,kind:"tung",name:"TUNG TUNG TUNG SAHUR"};
}
function drawBrainrot(){
 if(!brainrot)return;
 const b=brainrot,x=b.x,y=b.y;
 rect(x+18,y+20,26,42);rect(x+10,y+5,42,20);rect(x+16,y+2,30,6);
 rect(x+20,y+25,6,7,"#fff");rect(x+36,y+25,6,7,"#fff");rect(x+27,y+32,5,4,"#fff");rect(x+31,y+42,9,4,"#fff");
 rect(x+14,y+59,10,17);rect(x+39,y+59,10,17);rect(x+7,y+30,11,28);rect(x+44,y+30,11,28);rect(x+2,y+47,10,5);rect(x+50,y+47,10,5);
 text(b.name,x+b.w/2,y-8,10,"center");
}
function activateBoost(mult){if(state==="title"||state==="gameover")reset();if(state!=="play")return;turboMode=mult;turboTime=8}
function makeObstacle(){
 const r=Math.random();let o;
 if(r<.18)o={x:W+25,y:groundY-75,w:30,h:75,type:"tallCactus"};
 else if(r<.36)o={x:W+25,y:groundY-48,w:62,h:48,type:"doubleCactus"};
 else if(r<.52)o={x:W+25,y:groundY-35,w:52,h:35,type:"rock"};
 else if(r<.67)o={x:W+25,y:groundY-29,w:70,h:29,type:"log"};
 else if(r<.82)o={x:W+25,y:groundY-43,w:48,h:43,type:"stump"};
 else o={x:W+25,y:groundY-32,w:86,h:32,type:"spikes"};
 obstacles.push(o);
 if(Math.random()<.18&&speed<18)obstacles.push({x:W+145,y:groundY-30,w:42,h:30,type:"rock"});
}
function collide(a,b){return a.x+14<b.x+b.w-7&&a.x+a.w-13>b.x+7&&a.y+10<b.y+b.h&&a.y+a.h-7>b.y}
function drawDino(){
 const x=dino.x,y=dino.y,run=Math.floor(dino.frame/5)%2;
 const body=colorMode?"#4caf50":"#000000",dark=colorMode?"#388e3c":"#000000";
 rect(x+7,y+31,18,12,body);rect(x-5,y+38,16,10,body);rect(x-15,y+45,13,7,body);rect(x+21,y+20,40,39,body);rect(x+42,y+9,25,31,body);rect(x+57,y+3,17,24,body);rect(x+69,y+16,15,10,body);rect(x+78,y+22,8,7,body);rect(x+51,y+39,20,11,body);
 rect(x+25,y+14,9,8,body);rect(x+35,y+11,9,9,body);rect(x+45,y+10,8,9,body);rect(x+67,y+11,6,6,"#fff");rect(x+68,y+12,3,3,dark);rect(x+74,y+28,10,3,"#fff");rect(x+51,y+31,8,20,body);rect(x+57,y+48,12,4,body);
 if(!dino.onGround||run===0){rect(x+27,y+53,13,14,dark);rect(x+22,y+66,18,5,dark);rect(x+53,y+53,13,10,dark);rect(x+61,y+63,16,6,dark)}
 else{rect(x+27,y+53,13,10,dark);rect(x+20,y+63,18,6,dark);rect(x+53,y+53,13,14,dark);rect(x+53,y+66,18,5,dark)}
 rect(x+29,y+25,8,5,"#fff");rect(x+38,y+30,5,4,"#fff");
}
function drawObstacle(o){
 const x=o.x,y=o.y; const col=colorMode?"#2f7d32":"#000"; const spikeCol="#777";
 if(o.type==="tallCactus"){rect(x+9,y,16,o.h,col);rect(x+1,y+23,10,8,col);rect(x-2,y+15,9,10,col);rect(x+23,y+35,11,9,col);rect(x+24,y+27,9,10,col);rect(x+4,y+10,5,8,"#fff")}
 else if(o.type==="doubleCactus"){rect(x+7,y+9,17,39,col);rect(x+35,y,17,48,col);rect(x,y+20,11,9,col);rect(x-2,y+12,10,11,col);rect(x+50,y+24,12,9,col);rect(x+51,y+16,9,12,col);rect(x+12,y+14,5,5,"#fff")}
 else if(o.type==="rock"){rect(x+5,y+13,o.w-10,o.h-13,col);rect(x+14,y+5,o.w-28,10,col);rect(x+20,y+2,16,8,col);rect(x+12,y+18,8,5,"#fff")}
 else if(o.type==="log"){rect(x,y+7,o.w,o.h-7,col);rect(x+7,y,o.w-14,10,col);rect(x+8,y+10,5,13,"#fff");rect(x+o.w-13,y+11,5,12,"#fff")}
 else if(o.type==="stump"){rect(x+5,y+12,o.w-10,o.h-12,col);rect(x,y+4,o.w,12,col);rect(x+10,y+6,8,4,"#fff");rect(x+o.w-18,y+6,7,4,"#fff")}
 else{rect(x,y+16,o.w,16,col);for(let i=0;i<5;i++){rect(x+i*18+4,y+4,8,14,spikeCol);rect(x+i*18+7,y,3,8,spikeCol)}}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(colorMode){rect(0,0,W,H,"#8ed6ff");rect(0,320,W,155,"#9bd36a");rect(0,groundY,W,H-groundY,"#d8b36a");for(let i=0;i<8;i++){const mx=i*170-((distance*.15)%170);rect(mx,300-(i%2)*18,110,22,"#72ad59");rect(mx+35,280-(i%2)*18,45,25,"#72ad59");}}


 for(const c of clouds){rect(c.x,c.y,c.w,6);rect(c.x+9,c.y-6,c.w-18,6);rect(c.x+18,c.y-11,c.w-36,5)}
 text("DINO RUN",30,45,24);text("DIST "+String(Math.floor(distance)).padStart(5,"0"),W-30,45,20,"right");text("HI "+String(high).padStart(5,"0"),W-30,70,16,"right");text("SPEED "+speed.toFixed(1),30,70,16);
 if(turboMode===3)text("TURBO 3X!",W/2,48,22,"center");if(turboMode===10)text("TURBO C 10X!",W/2,48,22,"center");
 if(nukeFlash>0){rect(0,0,W,H,"#fff");text("☢ N U K E !",W/2,220,58,"center");text("EVERYTHING BLASTED AWAY!",W/2,275,24,"center")}
 rect(0,groundY,W,5);for(let x=-(distance*3%64);x<W;x+=64){rect(x,groundY+14,34,4);rect(x+42,groundY+20,10,3)}
 if(colorMode){ctx.save();}drawDino();for(const o of obstacles)drawObstacle(o);drawBrainrot();if(colorMode){ctx.restore();}
 if(state==="title"){rect(0,0,W,H,"#fff");text("DINO RUN",W/2,195,64,"center");text("16-BIT • BLACK & WHITE",W/2,235,22,"center");text("A REAL PIXEL DINO RUN",W/2,270,18,"center");text("PRESS SPACE OR CLICK TO START",W/2,325,23,"center");text("JUMP THE CACTI, ROCKS, LOGS & SPIKES",W/2,365,16,"center");text("X = 3X SUPER SPEED",W/2,400,20,"center");text("C = 10X SUPER SPEED",W/2,430,20,"center");text("Z = SUPER JUMP!!!",W/2,460,20,"center");text("V = TUNG TUNG TUNG SAHUR",W/2,490,18,"center");text("N = NUKE BLAST",W/2,520,18,"center")}
 if(state==="gameover"){rect(0,0,W,H,"#fff");text("GAME OVER",W/2,220,58,"center");text("DISTANCE: "+Math.floor(distance),W/2,265,23,"center");text("SPEED REACHED: "+speed.toFixed(1),W/2,295,17,"center");text("PRESS SPACE / CLICK TO RUN AGAIN",W/2,345,20,"center")}
}
function loop(t){
 const dt=Math.min((t-last)/16.67,2);last=t;
 if(state==="play"){
   if(nukeFlash>0)nukeFlash=Math.max(0,nukeFlash-dt/30);
   if(nukePower>0){
     nukePower=Math.max(0,nukePower-dt/60);
     nukeTimer-=dt/60;
     dino.x=Math.min(1000,dino.x+18*dt);
     distance+=120*dt;
     if(nukeTimer<=0){nukePower=0;nukeTimer=0;dino.x=145;dino.y=groundY-dino.h;dino.vy=0;dino.onGround=true}
   }
   if(turboMode){turboTime-=dt/60;if(turboTime<=0){turboMode=0;turboTime=0}}
   const boost=turboMode||1;distance+=speed*.018*dt*boost;score=Math.floor(distance);
   speed=Math.min(turboMode===10?230:turboMode===3?69:23,7+distance/95);
   dino.vy+=.86*dt;dino.y+=dino.vy*dt;
   if(dino.y>=groundY-dino.h){dino.y=groundY-dino.h;dino.vy=0;dino.onGround=true}
   dino.frame+=dt*speed*boost;spawn-=dt*boost;
   if(spawn<=0){makeObstacle();spawn=Math.max(29,82-speed*2.15)+Math.random()*34}
   for(const o of obstacles)o.x-=speed*dt*boost;
   if(brainrot){brainrot.x-=(speed+3)*dt;if(brainrot.x+brainrot.w<0)brainrot=null}
   if(brainrot&&collide(dino,brainrot)){state="gameover";high=Math.max(high,score);localStorage.dinoHigh=high}
   obstacles=obstacles.filter(o=>o.x+o.w>-40);
   for(const o of obstacles){if(collide(dino,o)){state="gameover";high=Math.max(high,score);localStorage.dinoHigh=high;break}}
   for(const c of clouds){c.x-=speed*.10*dt*boost;if(c.x+c.w<0)c.x=W+Math.random()*180}
 }
 draw();requestAnimationFrame(loop);
}
function toggleColor(){colorMode=!colorMode;document.getElementById("game").style.background=colorMode?"#9fddff":"#fff";draw()}
function handleKey(e){
 if(e.type!=="keydown" || e.repeat)return;const k=String(e.key||"").toLowerCase();const c=String(e.code||"");
 if(c==="Space"||c==="ArrowUp"||k===" "||k==="arrowup"){e.preventDefault();jump();return}
 if(c==="KeyX"||k==="x"){e.preventDefault();activateBoost(3);return}
 if(c==="KeyC"||k==="c"){e.preventDefault();activateBoost(10);return}
 if(c==="KeyZ"||k==="z"||e.keyCode===90){e.preventDefault();superJump();return}
 if(c==="KeyV"||k==="v"||e.keyCode===86){e.preventDefault();spawnBrainrot();return}
 if(c==="KeyN"||k==="n"||e.keyCode===78){e.preventDefault();nuke();return}
 if(c==="KeyB"||k==="b"||e.keyCode===66){e.preventDefault();toggleColor();return}
}
window.addEventListener("keydown",handleKey,true);
canvas.addEventListener("pointerdown",jump);
document.getElementById("music").addEventListener("pointerdown",e=>{e.stopPropagation();musicOn=!musicOn;e.currentTarget.textContent=musicOn?"MUSIC: ON":"MUSIC: OFF";if(musicOn)startMusic();else stopMusic()});
document.getElementById("touch").addEventListener("pointerdown",e=>{e.stopPropagation();jump()});
document.getElementById("super").addEventListener("pointerdown",e=>{e.stopPropagation();superJump()});
requestAnimationFrame(loop);
</script>
</body>
</html>
